<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數學怪物 MATH MONSTER</title>

  <script src="./questions/stage1.js"></script>
  <script src="./questions/stage2.js"></script>
  <script src="./questions/stage3.js"></script>
  <script src="./questions/stage4.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0A0A0A; }
    ::-webkit-scrollbar { display: none; }
    @keyframes popIn {
      0% { transform: scale(0) translateY(50px); opacity: 0; }
      70% { transform: scale(1.2) translateY(-10px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .lotto-ball { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* 自訂音量滑桿樣式 */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px; width: 16px;
      border-radius: 50%;
      background: #e6b800;
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 5px rgba(230,184,0,0.8);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 4px;
      cursor: pointer;
      background: #4b5563;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const MathCanvasBackground = () => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const resizeCanvas = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const mathSymbols = ['∑', '∫', '∬', '∂', '∇', '∆', 'π', '∞', '√', 'f(x)', 'lim', 'sin', 'cos', 'e=mc²'];
        const fontSize = 16;
        const columns = Math.ceil(canvas.width / fontSize);
        const drops = Array(columns).fill(0).map(() => Math.random() * canvas.height * -1);
        const draw = () => {
          ctx.fillStyle = 'rgba(10, 10, 10, 0.1)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.font = `${fontSize}px "Courier New", monospace`;
          for (let i = 0; i < drops.length; i++) {
            const text = mathSymbols[Math.floor(Math.random() * mathSymbols.length)];
            const opacity = Math.random() * 0.2 + 0.1;
            ctx.fillStyle = `rgba(0, 255, 65, ${opacity})`;
            ctx.fillText(text, i * fontSize, drops[i]);
            drops[i] += 2;
            if (drops[i] > canvas.height) drops[i] = fontSize * -5;
          }
        };
        const interval = setInterval(draw, 33);
        return () => { clearInterval(interval); window.removeEventListener('resize', resizeCanvas); };
      }, []);
      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-0" />;
    };

    const App = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const isHost = urlParams.get('role') === 'host';
      const isDisplay = urlParams.get('role') === 'display';

      const wsRef = useRef(null);

      const [isConnected, setIsConnected] = useState(false);
      const [isReconnecting, setIsReconnecting] = useState(false);

      const [gameState, setGameState] = useState('login');
      const [timeLeft, setTimeLeft] = useState(0);
      const [players, setPlayers] = useState([]);
      const [hostPlayerDetails, setHostPlayerDetails] = useState([]);
      const [currentQuestionData, setCurrentQuestionData] = useState(null);
      const [selectedQ, setSelectedQ] = useState({ stage_1: 0, stage_3: 0, stage_4: 0 });

      const [leaderboardData, setLeaderboardData] = useState([]);
      const [correctAnswer, setCorrectAnswer] = useState('');

      const [nickname, setNickname] = useState('');
      const nicknameRef = useRef(nickname);

      const [answer, setAnswer] = useState('');
      const [isSubmitted, setIsSubmitted] = useState(false);
      const isSubmittedRef = useRef(isSubmitted);

      const [bingoGrid, setBingoGrid] = useState([]);
      const [bingoLines, setBingoLines] = useState(0);
      const [isBingoStage, setIsBingoStage] = useState(false);
      const [calledNumbers, setCalledNumbers] = useState([]);
      const [callNumInput, setCallNumInput] = useState('');
      const [bingoAlert, setBingoAlert] = useState(null);
      const [playerLinesMap, setPlayerLinesMap] = useState({});

      const [myScore, setMyScore] = useState(0);
      const [myAddedScore, setMyAddedScore] = useState(0);
      const [myTimeTaken, setMyTimeTaken] = useState(0);
      const [amICorrect, setAmICorrect] = useState(false);
      const [myRank, setMyRank] = useState(-1);
      const [myLastAnswer, setMyLastAnswer] = useState('');

      // --- 🎵 音樂播放控制系統 ---
      const audioRef = useRef(null);
      const [currentTrack, setCurrentTrack] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [volume, setVolume] = useState(0.5);

      useEffect(() => {
        if (isHost) {
          audioRef.current = new Audio();
          audioRef.current.loop = true;
          audioRef.current.volume = volume;
          audioRef.current.onplay = () => setIsPlaying(true);
          audioRef.current.onpause = () => setIsPlaying(false);
        }
        return () => {
          if (audioRef.current) {
            audioRef.current.pause();
            audioRef.current.src = "";
          }
        };
      }, [isHost]);

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = volume;
        }
      }, [volume]);

      const bgmTracks = [
        { id: 'bgm1', name: '🎵 歡樂等待大廳', file: './bgm1.mp3', color: 'bg-green-700/60 hover:bg-green-600' },
        { id: 'bgm2', name: '⏱️ 緊張搶答倒數', file: './bgm2.mp3', color: 'bg-red-700/60 hover:bg-red-600' },
        { id: 'bgm3', name: '🎰 賓果歡樂開獎', file: './bgm3.mp3', color: 'bg-blue-700/60 hover:bg-blue-600' },
        { id: 'bgm4', name: '🏆 史詩榮耀頒獎', file: './bgm4.mp3', color: 'bg-yellow-700/60 hover:bg-yellow-600' }
      ];

      const playTrack = (trackFile) => {
        if (!audioRef.current) return;
        if (currentTrack === trackFile) {
          if (isPlaying) audioRef.current.pause();
          else audioRef.current.play().catch(e => console.error(e));
        } else {
          audioRef.current.src = trackFile;
          audioRef.current.play().catch(e => console.error(e));
          setCurrentTrack(trackFile);
        }
      };

      const stopMusic = () => {
        if (audioRef.current) {
          audioRef.current.pause();
          audioRef.current.currentTime = 0;
          setIsPlaying(false);
          setCurrentTrack(null);
        }
      };
      // -------------------------

      useEffect(() => { isSubmittedRef.current = isSubmitted; }, [isSubmitted]);
      useEffect(() => { nicknameRef.current = nickname; }, [nickname]);

      useEffect(() => {
        let ws;
        let pingInterval;

        const connectWebSocket = () => {
          const backendUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'ws://localhost:8000/ws'
            : 'wss://math-monster-backend.onrender.com/ws';

          ws = new WebSocket(backendUrl);
          wsRef.current = ws;

          ws.onopen = () => {
            setIsConnected(true);
            setIsReconnecting(false);

            if (isHost) ws.send(JSON.stringify({ type: 'PLAYER_JOIN', name: 'HOST' }));
            else if (isDisplay) ws.send(JSON.stringify({ type: 'PLAYER_JOIN', name: 'DISPLAY' }));
            else if (nicknameRef.current) ws.send(JSON.stringify({ type: 'PLAYER_JOIN', name: nicknameRef.current }));

            pingInterval = setInterval(() => {
              if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'PING' }));
            }, 20000);
          };

          ws.onclose = () => {
            setIsConnected(false);
            clearInterval(pingInterval);
            if (nicknameRef.current || isHost || isDisplay) {
              setIsReconnecting(true);
              setTimeout(connectWebSocket, 3000);
            }
          };

          ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'SCORES_RESET') {
              setMyScore(0); setMyAddedScore(0);
              if (isHost) alert("所有挑戰者積分已成功歸零！");
              setLeaderboardData(prev => prev.map(p => ({...p, score: 0, added_score: 0})));
              return;
            }

            if (data.type === 'UPDATE_CALLED_NUMBERS') {
              setCalledNumbers(data.called_numbers);
              return;
            }

            if (data.type === 'UPDATE_BINGO_LINES') {
              setPlayerLinesMap(prev => ({ ...prev, [data.name]: data.lines }));
              return;
            }

            if (data.type === 'BINGO_ACHIEVED') {
              setBingoAlert({ name: data.name, rank: data.rank });
              setTimeout(() => setBingoAlert(null), 5000);
              return;
            }

            if (data.type === 'UPDATE_PLAYERS') setPlayers(data.players.filter(p => p !== 'HOST' && p !== 'DISPLAY'));

            if (isHost) {
              if (data.type === 'HOST_UPDATE') setHostPlayerDetails(data.player_details);
              if (data.type === 'CHANGE_STATE') {
                setGameState(data.state);
                if ((data.state === 'result' || data.state === 'final_leaderboard') && data.leaderboard) setLeaderboardData(data.leaderboard);
              }
              if (data.type === 'START_TIMER') {
                setCurrentQuestionData(data.questionData);
                setIsBingoStage(data.stage === 'stage_2');
                setCalledNumbers([]);
                setPlayerLinesMap({});
                startLocalTimer(data.time, data.stage);
              }
            } else {
              if (data.type === 'CHANGE_STATE') {
                setGameState(data.state);
                if (data.state === 'login') { setNickname(''); }
                if (data.state === 'result' && data.leaderboard) {
                  setLeaderboardData(data.leaderboard);
                  setCorrectAnswer(data.correct_answer);
                  const myData = data.leaderboard.find(p => p.name === nicknameRef.current);
                  if (myData) {
                    setMyScore(myData.score);
                    setMyAddedScore(myData.added_score);
                    setMyTimeTaken(myData.time_taken);
                    setAmICorrect(myData.is_correct);
                    setMyRank(myData.rank);
                    setMyLastAnswer(myData.last_answer);
                  }
                }
                if (data.state === 'final_leaderboard' && data.leaderboard) {
                  setLeaderboardData(data.leaderboard);
                  const myData = data.leaderboard.find(p => p.name === nicknameRef.current);
                  if (myData) setMyScore(myData.score);
                }
              } else if (data.type === 'START_TIMER') {
                setCurrentQuestionData(data.questionData);
                setIsBingoStage(data.stage === 'stage_2');
                setCalledNumbers([]);
                setPlayerLinesMap({});
                startLocalTimer(data.time, data.stage);
              }
            }
          };
        };

        connectWebSocket();
        return () => { if (ws) { ws.onclose = null; ws.close(); } clearInterval(pingInterval); };
      }, [isHost, isDisplay]);

      const safeSend = (msgObject) => {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify(msgObject));
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if(nickname) { setGameState('waiting'); safeSend({ type: 'PLAYER_JOIN', name: nickname }); }
      };

      const startLocalTimer = (seconds, stage) => {
        setTimeLeft(seconds);
        setIsSubmitted(false);
        isSubmittedRef.current = false;
        setAnswer('');
        setGameState(stage);

        if (window.gameTimer) clearInterval(window.gameTimer);
        window.gameTimer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(window.gameTimer);
              if (stage !== 'stage_2') {
                  if (isHost) safeSend({ type: 'CHANGE_STATE', state: 'result' });
                  else if (!isHost && !isDisplay && !isSubmittedRef.current) {
                      safeSend({ type: 'SUBMIT_ANSWER', name: nicknameRef.current, answer: "未作答" });
                      setIsSubmitted(true); isSubmittedRef.current = true;
                  }
              }
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
      };

      const hostChangeState = (state) => { safeSend({ type: 'CHANGE_STATE', state: state }); };
      const resetAllScores = () => { if (window.confirm("⚠️ 警告：確定要清除所有挑戰者目前的積分嗎？此動作無法復原！")) safeSend({ type: 'RESET_SCORES' }); };
      const clearOfflinePlayers = () => { if (window.confirm("🧹 確定要清除目前離線的幽靈資料嗎？")) safeSend({ type: 'CLEAR_OFFLINE' }); };

      const hostStartStage = (stageName, dbName) => {
        const qIndex = selectedQ[stageName] || 0;
        const questionData = window[dbName] ? window[dbName][qIndex] : {};
        if (stageName === 'stage_2') safeSend({ type: 'START_TIMER', time: 999999, stage: stageName, questionData: {} });
        else safeSend({ type: 'START_TIMER', time: questionData.time, stage: stageName, questionData: questionData });
      };

      const hostCallNumber = () => {
        const num = parseInt(callNumInput);
        if (num > 0 && num <= 16) {
          safeSend({ type: 'CALL_BINGO_NUMBER', number: num });
          setCallNumInput('');
        } else {
          alert('請輸入 1~16 的數字！');
        }
      };

      const submitAnswerToBackend = (e) => {
        if(e) e.preventDefault();
        if (isSubmittedRef.current) return;
        setIsSubmitted(true); isSubmittedRef.current = true;
        const finalAnswer = isBingoStage ? "BINGO!" : answer;
        safeSend({ type: 'SUBMIT_ANSWER', name: nickname, answer: finalAnswer });
      };

      const handleOptionSubmit = (opt) => {
        if (isSubmittedRef.current) return;
        setIsSubmitted(true); isSubmittedRef.current = true;
        setAnswer(opt);
        safeSend({ type: 'SUBMIT_ANSWER', name: nickname, answer: opt });
      };

      useEffect(() => {
        if (!isHost && !isDisplay && gameState === 'stage_2' && bingoGrid.length === 0) {
          const allNums = Array.from({length: 16}, (_, i) => i + 1);
          const shuffled = allNums.sort(() => Math.random() - 0.5);
          setBingoGrid(shuffled.map(n => ({ num: n, selected: false })));
          setBingoLines(0);
        }
        if (gameState !== 'stage_2') setBingoGrid([]);
      }, [gameState, isHost, isDisplay]);

      const checkBingo = (grid) => {
        let lines = 0;
        for (let r = 0; r < 4; r++) { if (grid[r*4].selected && grid[r*4+1].selected && grid[r*4+2].selected && grid[r*4+3].selected) lines++; }
        for (let c = 0; c < 4; c++) { if (grid[c].selected && grid[c+4].selected && grid[c+8].selected && grid[c+12].selected) lines++; }
        if (grid[0].selected && grid[5].selected && grid[10].selected && grid[15].selected) lines++;
        if (grid[3].selected && grid[6].selected && grid[9].selected && grid[12].selected) lines++;
        return lines;
      };

      const handleBingoClick = (index) => {
        if (isSubmittedRef.current) return;

        const targetNum = bingoGrid[index].num;
        if (!bingoGrid[index].selected && !calledNumbers.includes(targetNum)) {
            return;
        }

        const newGrid = [...bingoGrid];
        newGrid[index].selected = !newGrid[index].selected;
        setBingoGrid(newGrid);

        const newLines = checkBingo(newGrid);
        setBingoLines(newLines);

        safeSend({ type: 'SYNC_BINGO_LINES', name: nickname, lines: newLines });

        if (newLines >= 3 && !isSubmittedRef.current) {
            setIsSubmitted(true);
            isSubmittedRef.current = true;
            safeSend({ type: 'SUBMIT_ANSWER', name: nickname, answer: "BINGO!" });
        }
      };

      const renderQuestionText = (text) => {
        if (!text) return null;
        return text.split(/(請問)/g).map((part, i) =>
          part === '請問' ? <React.Fragment key={i}><br/><span className="text-yellow-400">請問</span></React.Fragment> : part
        );
      };

      const GlobalBingoAlert = () => {
        if (!bingoAlert) return null;
        return (
          <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm pointer-events-none">
            <div className="bg-gradient-to-br from-yellow-300 to-yellow-600 text-black px-16 py-12 rounded-3xl text-center shadow-[0_0_80px_rgba(250,204,21,1)] animate-bounce border-4 border-white transform scale-110">
               <h2 className="text-6xl md:text-8xl font-black mb-6 drop-shadow-md">🎉 BINGO! 🎉</h2>
               <p className="text-4xl md:text-5xl font-bold">挑戰者 <span className="text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)]">{bingoAlert.name}</span></p>
               <p className="text-3xl md:text-4xl mt-6 font-bold bg-black/20 inline-block px-6 py-2 rounded-full">奪得第 {bingoAlert.rank} 名</p>
            </div>
          </div>
        );
      };

      // ==========================================
      // 1. 主持人後台 (Host UI)
      // ==========================================
      if (isHost) {
        return (
          <div className="h-[100dvh] w-full bg-gray-900 text-white p-4 md:p-6 pb-24 font-mono overflow-y-auto relative">
            <GlobalBingoAlert />
            <header className="border-b border-[#00FF41] pb-4 mb-4 md:mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div className="flex items-center gap-2 md:gap-3">
                <h1 className="text-2xl md:text-3xl font-bold text-[#00FF41]">SYSTEM_HOST_DASHBOARD</h1>
                <div className={`w-3 h-3 md:w-4 md:h-4 rounded-full shrink-0 ${isConnected ? 'bg-green-500' : 'bg-red-500 animate-pulse'}`}></div>
              </div>
              <div className="flex gap-2 items-center flex-wrap w-full md:w-auto">
                <div className="bg-gray-800 px-3 py-1.5 md:px-4 md:py-2 rounded text-sm md:text-base">連線: <span className="text-[#00FF41] font-bold">{players.length}</span></div>
                <button onClick={clearOfflinePlayers} className="px-3 py-1.5 md:px-4 md:py-2 bg-gray-700 hover:bg-gray-600 border border-gray-500 rounded text-gray-200 transition text-xs md:text-sm flex-1 md:flex-none">🧹 清除離線</button>
                <button onClick={resetAllScores} className="px-3 py-1.5 md:px-4 md:py-2 bg-red-900/50 hover:bg-red-700 border border-red-500 rounded text-red-100 transition shadow-[0_0_8px_rgba(239,68,68,0.5)] text-xs md:text-sm flex-1 md:flex-none">清除所有積分</button>
              </div>
            </header>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

              <div className="flex flex-col gap-6 max-h-[50vh] md:max-h-[80vh] overflow-y-auto pr-2">
                <div className="bg-gray-800 p-4 rounded-xl border border-gray-700">
                  {(gameState === 'result' || gameState === 'final_leaderboard') ? (
                    <>
                      <h2 className="text-xl mb-4 border-b border-gray-600 pb-2 text-yellow-400 font-bold">🏆 {gameState === 'final_leaderboard' ? '最終總排行' : '排行榜 Top 5'}</h2>
                      <div className="flex flex-col gap-2">
                        {leaderboardData.map((p, i) => (
                          <div key={i} className="bg-gray-900 px-4 py-3 rounded flex justify-between items-center border border-[#00FF41]/30">
                            <div className="flex items-center gap-3"><span className="text-gray-400 font-bold w-6">{i + 1}.</span><span className="text-lg text-white">{p.name}</span></div>
                            <div className="text-right">
                               <div className="text-xl text-yellow-400 font-bold">{p.score} 分</div>
                               {gameState === 'result' && <div className="text-xs text-gray-500">+{p.added_score} ({p.rank > 0 ? `第${p.rank}名` : p.time_taken+'s'})</div>}
                            </div>
                          </div>
                        ))}
                      </div>
                    </>
                  ) : (
                    <>
                      <h2 className="text-xl mb-4 border-b border-gray-600 pb-2">連線挑戰者狀態</h2>
                      <div className="flex flex-col gap-2">
                        {hostPlayerDetails.length === 0 && <p className="text-gray-500">等待挑戰者連線...</p>}
                        {hostPlayerDetails.map((p, i) => (
                          <div key={i} className={`bg-gray-900 px-4 py-2 rounded flex flex-col border ${p.is_online ? 'border-[#00FF41]/30' : 'border-gray-600 opacity-50'}`}>
                            <div className="flex justify-between items-center">
                              <div className="flex items-center gap-2">
                                <div className={`w-2 h-2 rounded-full ${!p.is_online ? 'bg-gray-500' : p.has_answered ? 'bg-yellow-400' : 'bg-[#00FF41] animate-pulse'}`}></div>
                                <span className="font-bold text-white">{p.name} {!p.is_online && <span className="text-xs text-red-400 ml-1">(離線)</span>}</span>
                              </div>
                              <div className="text-sm text-yellow-400 font-bold">{p.score} 分</div>
                            </div>
                            {p.has_answered && (
                              <div className="text-xs text-gray-400 mt-1 pt-1 border-t border-gray-700 flex justify-between">
                                <span>當前答案: <span className="text-white text-sm">{p.last_answer}</span></span>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </div>

                <div className="bg-gray-800 p-4 rounded-xl border border-[#b8860b] shadow-[0_0_15px_rgba(184,134,11,0.2)]">
                  <h2 className="text-xl mb-3 border-b border-gray-600 pb-2 text-[#e6b800] font-bold flex items-center gap-2">
                    🎵 氣氛 DJ 控制台 {isPlaying && <span className="w-2 h-2 rounded-full bg-[#e6b800] animate-ping ml-2"></span>}
                  </h2>
                  <div className="flex flex-wrap gap-2">
                    {bgmTracks.map(track => (
                      <button key={track.id} onClick={() => playTrack(track.file)}
                        className={`px-3 py-2 rounded font-bold transition flex-1 min-w-[120px] text-sm md:text-base border border-gray-600
                        ${currentTrack === track.file && isPlaying ? 'bg-green-600 text-white shadow-[0_0_10px_#22c55e] border-green-400' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}
                      >
                        {track.name} {currentTrack === track.file && isPlaying ? '⏸' : '▶'}
                      </button>
                    ))}
                  </div>
                  <div className="mt-3 flex flex-col md:flex-row justify-between items-center border-t border-gray-700 pt-3 gap-3">
                    <div className="flex items-center gap-2 w-full md:w-auto">
                       <span className="text-sm text-gray-300">🔊 音量</span>
                       <input
                         type="range"
                         min="0" max="1" step="0.01"
                         value={volume}
                         onChange={(e) => setVolume(parseFloat(e.target.value))}
                         className="w-full md:w-28 cursor-pointer"
                       />
                       <span className="text-xs text-yellow-400 w-8">{(volume * 100).toFixed(0)}%</span>
                    </div>

                      <select className="w-full bg-black text-white p-2 rounded mb-3 border border-[#889ed8]/50" onChange={(e) => setSelectedQ({...selectedQ, stage_1: parseInt(e.target.value)})}>

                    <div className="p-4 bg-gray-900 border-2 border-[#7cd0d7]/60 rounded-xl shadow-[0_0_10px_rgba(124,208,215,0.1)]">

      // ==========================================
      // 2. 大螢幕專用畫面 (Display UI)
      // ==========================================
      if (isDisplay) {

          <div className="min-h-screen bg-[#0A0A0A] text-[#00FF41] font-mono relative flex flex-col px-2 py-4 md:p-8 h-screen w-screen overflow-hidden">

            <GlobalBingoAlert />

            {isReconnecting && (
              <div className="absolute top-0 left-0 w-full bg-red-600/90 text-white text-center py-2 md:py-4 z-50 animate-pulse text-lg md:text-2xl font-bold shadow-[0_0_20px_rgba(220,38,38,0.5)]">

                     <span className="text-yellow-400 text-lg md:text-3xl">| BINGO 進行中</span>

              {gameState === 'stage_2' && calledNumbers.length > 0 && (

                      <div key={i} className="lotto-ball w-12 h-12 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-yellow-100 to-yellow-400 text-black font-black text-2xl md:text-4xl flex items-center justify-center shadow-[0_0_15px_#facc15] border-2 border-white shrink-0">

                  </div>

                    <div className="flex flex-col items-center justify-center mb-4 md:mb-6 shrink-0">
                      <p className="text-gray-300 text-lg md:text-2xl lg:text-3xl font-bold whitespace-nowrap mb-2 md:mb-4">掃描 QR Code 或輸入網址加入遊戲</p>

                    <div className="flex-1 overflow-y-auto w-full pb-4 px-2">

                      {players.map((p, i) => {

                         const isBingo = lines >= 3;
                         return (
                           <div key={i} className={`px-3 py-1.5 md:px-4 md:py-2 text-sm md:text-lg lg:text-xl bg-black/60 border ${isBingo ? 'border-yellow-400 shadow-[0_0_15px_#facc15] scale-105 z-10' : 'border-[#00FF41]'} rounded-full text-white flex items-center gap-2 transition-all duration-300`}>
                             <div className={`w-2 h-2 md:w-3 md:h-3 ${isBingo ? 'bg-yellow-400' : 'bg-[#00FF41]'} rounded-full shrink-0`}></div>

                         );

                          <p className="text-3xl md:text-5xl lg:text-7xl text-white font-bold bg-[#00FF41]/20 inline-block px-6 py-3 md:px-10 md:py-4 rounded-3xl border border-[#00FF41]/50">{correctAnswer}</p>

                            <div className="mt-6 md:mt-8 p-4 md:p-6 bg-black/60 border border-[#7cd0d7]/50 rounded-2xl text-left max-w-3xl mx-auto shadow-[0_0_15px_rgba(124,208,215,0.2)]">
                              <p className="text-[#7cd0d7] font-bold text-lg md:text-2xl mb-2">💡 詳解說明：</p>
                              <p className="text-gray-200 text-base md:text-xl leading-relaxed whitespace-pre-wrap">{currentQuestionData.explanation}</p>

                    <div className="space-y-3 md:space-y-4 flex-1 overflow-y-auto pr-2 pb-4">

                        <div key={i} className="flex flex-col md:flex-row justify-between items-center bg-gray-900/80 p-4 md:p-5 lg:p-6 rounded-2xl border border-[#00FF41]/40 text-xl md:text-3xl lg:text-4xl gap-2 md:gap-0">

                          <div className="flex items-center justify-end gap-3 md:gap-6 w-full md:w-auto mt-2 md:mt-0">

                             <span className="text-yellow-400 font-bold min-w-[80px] md:w-40 text-right whitespace-nowrap">{p.score} 分</span>
                          </div>
                        </div>
                      ))}

                        <div key={i} className={`flex flex-col md:flex-row justify-between items-center p-4 md:p-6 lg:p-8 rounded-2xl border-2 text-2xl md:text-4xl lg:text-5xl

                            <span className="truncate max-w-[200px] md:max-w-[400px]">{p.name}</span>
                          </div>
                          <span className="tracking-wider mt-2 md:mt-0 text-right w-full md:w-auto">{p.score} 分</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // 3. 玩家前端遊戲作答區 (Player UI)
      // ==========================================
      const renderStageContent = () => {
        if (isSubmittedRef.current && gameState !== 'stage_2') {
          return (
            <div className="my-auto text-center p-10 bg-[#00FF41]/15 rounded-2xl border-2 border-[#00FF41] shadow-[0_0_15px_rgba(0,255,65,0.1)] w-full">

        switch (gameState) {
          case 'stage_1':
            return (
              <div className="my-auto space-y-4 w-full">
                <div className="bg-[#00FF41]/5 p-6 md:p-8 rounded-2xl border-2 border-[#00FF41]/30 text-xl md:text-3xl text-center shadow-inner relative">

                      onClick={() => handleOptionSubmit(opt)}
                      className="w-full bg-black/50 border-2 border-[#00FF41] hover:bg-[#00FF41]/30 text-white font-bold text-lg md:text-2xl p-4 md:p-6 rounded-xl active:scale-95 transition-all text-left flex items-center shadow-[0_0_10px_rgba(0,255,65,0.1)]"

                      <span className="text-[#00FF41] mr-3">{opt.split('.')[0]}.</span>

          case 'stage_2':
            return (
              <div className="flex flex-col h-full items-center justify-center space-y-3 md:space-y-6 w-full mt-2">
                <div className="grid grid-cols-4 gap-2 md:gap-3 w-full max-w-[360px]">
                  {bingoGrid.map((item, i) => (
                    <button key={i} onClick={() => handleBingoClick(i)}
                      className={`aspect-square text-2xl md:text-4xl font-bold rounded-lg border-2 flex items-center justify-center transition-all
                      ${item.selected ? 'bg-yellow-400 text-black border-white shadow-[0_0_15px_rgba(250,204,21,0.8)]' : 'bg-black text-[#00FF41] border-[#00FF41]/50 hover:bg-[#00FF41]/20'}`}>
                      {item.num}
                    </button>
                  ))}
                </div>

                <div className="text-white text-lg md:text-xl">目前連線: <span className="text-yellow-400 font-bold text-2xl md:text-3xl mx-2">{bingoLines}</span> 條 / 目標: 3 條</div>

                {isSubmittedRef.current ? (
                  <div className="w-full text-center p-3 md:p-4 rounded-xl bg-yellow-500/20 border-2 border-yellow-400 text-yellow-400 font-bold animate-pulse text-lg md:text-xl shadow-[0_0_15px_rgba(250,204,21,0.5)]">
                    🎉 BINGO！請向主持人出示此畫面 🎉
                  </div>
                ) : (
                  <div className="w-full text-center p-3 md:p-4 rounded-xl bg-gray-800 text-gray-500 border border-gray-700 font-bold text-lg">

                  </div>
                )}
              </div>
            );

          case 'stage_3':
            return (
              <form onSubmit={submitAnswerToBackend} className="my-auto space-y-5 w-full">
                <div className="bg-[#00FF41]/5 p-8 rounded-2xl border-2 border-[#00FF41]/30 text-2xl md:text-4xl text-center shadow-inner relative">
                  解析以下加密序列：<br/>
                  <div className="text-yellow-400 font-bold mt-4 tracking-widest drop-shadow-[0_0_8px_rgba(250,204,21,0.5)]">{renderQuestionText(currentQuestionData?.text)}</div>
                </div>
                <input type="text" value={answer} onChange={(e) => setAnswer(e.target.value)} placeholder="輸入破解數字..." className="w-full bg-black/50 border-2 border-[#00FF41] rounded-xl p-6 text-center text-3xl outline-none focus:bg-[#00FF41]/20 focus:text-white" />
                <button type="submit" className="w-full bg-[#00FF41] text-black font-bold text-2xl p-6 rounded-xl active:scale-95 shadow-[0_0_15px_rgba(0,255,65,0.3)]">送出</button>
              </form>
            );
          default: return null;
        }
      };

      return (
        <div className="min-h-[100dvh] w-full bg-[#0A0A0A] text-[#00FF41] font-mono relative overflow-hidden flex items-center justify-center p-2 md:p-4">
          <MathCanvasBackground />
          <GlobalBingoAlert />

          {isReconnecting && (
            <div className="absolute top-0 left-0 w-full bg-red-600/90 text-white text-center py-2 z-50 animate-pulse text-sm md:text-base font-bold shadow-[0_0_15px_rgba(220,38,38,0.5)]">
              ⚠️ 失去連線，系統正在背景自動為您重新連線中...
            </div>
          )}

          <div className="relative z-10 w-full max-w-[430px] md:max-w-3xl lg:max-w-4xl h-[95dvh] md:h-[85vh] bg-black/85 md:border md:border-[#00FF41]/30 md:rounded-2xl flex flex-col shadow-[0_0_40px_rgba(0,255,65,0.15)] backdrop-blur-[2px]">

            <div className="flex flex-wrap items-center justify-between p-3 md:p-4 border-b border-[#00FF41]/30 bg-black/50 md:rounded-t-2xl relative z-20 shrink-0 gap-y-2">
              <div className="flex items-center gap-1 md:gap-2 flex-1 min-w-[200px]">
                <span className="font-bold tracking-widest text-sm md:text-xl drop-shadow-[0_0_5px_#00FF41] flex items-center flex-wrap shrink-0">
                  MATH_MONSTER LIVE
                  {gameState.startsWith('stage_') && (
                    <span className="text-[#00FF41]/70 text-[10px] md:text-sm ml-1 md:ml-2 whitespace-nowrap">
                      | {gameState === 'stage_1' ? 'STAGE_01: SPEED_HUNT' :
                         gameState === 'stage_2' ? 'STAGE_02: BINGO' :
                         gameState === 'stage_3' ? 'STAGE_03: DETECTIVE' :
                         gameState === 'stage_4' ? 'STAGE_04: MONSTER' : ''}
                    </span>
                  )}
                </span>
                <div className={`w-2 h-2 md:w-3 md:h-3 rounded-full ml-1 md:ml-2 shrink-0 ${isConnected ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-red-500 animate-pulse'}`} title={isConnected ? '已連線' : '斷線'}></div>
              </div>

              {gameState !== 'login' && (
                <div className="flex gap-2 items-center bg-black/50 px-2 py-1 md:px-3 md:py-1 rounded-full border border-[#00FF41]/20 text-xs md:text-base shrink-0">
                  <span className="text-[#00FF41]/90 whitespace-nowrap max-w-[80px] md:max-w-[150px] truncate">{nickname}</span>
                  <div className="h-3 md:h-4 w-[1px] bg-[#00FF41]/20"></div>
                  <span className="text-yellow-400 font-bold whitespace-nowrap">🏆 {myScore}</span>
                </div>
              )}
            </div>

            <div className="flex-1 overflow-y-auto p-4 md:p-12 flex flex-col relative z-10">

              {gameState === 'login' && (
                <div className="w-full max-w-sm mx-auto space-y-10 my-auto py-8">
                  <div className="text-center space-y-3">
                    <h1 className="text-4xl md:text-6xl font-bold mb-4 drop-shadow-[0_0_10px_#00FF41]">系統登入</h1>
                    <p className="text-[#00FF41]/70 md:text-xl font-light">請輸入您的挑戰者代號</p>
                  </div>
                  <form onSubmit={handleLogin} className="space-y-5">
                    <input type="text" value={nickname} onChange={(e) => setNickname(e.target.value)} placeholder="例如：玩家A" className="w-full bg-transparent border-2 border-[#00FF41] rounded-xl p-5 text-center text-2xl md:text-3xl outline-none focus:bg-[#00FF41]/10" maxLength={15} autoFocus />
                    <button type="submit" className="w-full bg-[#00FF41] text-black font-bold text-2xl md:text-3xl p-5 rounded-xl active:scale-95 w-full">INITIALIZE</button>
                  </form>
                </div>
              )}

              {gameState === 'waiting' && (
                <div className="text-center space-y-10 w-full max-w-2xl mx-auto my-auto py-8">
                  <h2 className="text-3xl md:text-5xl font-bold leading-tight animate-pulse">等待任務發送...</h2>
                  <div className="bg-[#00FF41]/10 p-8 rounded-2xl border border-[#00FF41]/30">
                    <p className="text-[#00FF41]/80 text-xl">請觀看現場大螢幕或等待主持人指示</p>
                  </div>
                </div>
              )}

              {gameState.startsWith('stage_') && (
                <div className="w-full max-w-3xl mx-auto flex flex-col h-full gap-4 md:gap-6 pb-2 my-auto">
                  {gameState !== 'stage_2' && (
                    <div className="flex justify-center items-center gap-3 text-4xl md:text-6xl font-bold text-red-500 bg-red-950/30 w-fit mx-auto px-6 py-2 rounded-full border border-red-500/50 shadow-[0_0_20px_rgba(239,68,68,0.2)] mt-4">
                      ⏱️ <span className="tabular-nums">{timeLeft}s</span>
                    </div>
                  )}
                  {renderStageContent()}
                </div>
              )}

              {gameState === 'result' && (
                <div className="text-center space-y-6 w-full max-w-2xl mx-auto my-auto py-8">
                  <h2 className="text-4xl md:text-6xl font-bold text-white drop-shadow-[0_0_10px_#00FF41]">回合結束</h2>
                  <div className="bg-black/60 p-6 md:p-8 rounded-2xl border-2 border-[#00FF41]/50 space-y-4 shadow-xl relative">

                    {correctAnswer && !isBingoStage && (
                      <div className="mb-2">
                        <p className="text-[#00FF41]/80 text-lg">本題正確答案：</p>
                        <p className="text-3xl text-white font-bold tracking-widest">{correctAnswer}</p>

                        {/* 🌟 玩家手機畫面顯示詳解 */}
                        {currentQuestionData?.explanation && (
                          <div className="mt-4 p-4 md:p-5 bg-black/60 border border-[#7cd0d7]/50 rounded-xl text-left shadow-[0_0_10px_rgba(124,208,215,0.2)]">
                            <p className="text-[#7cd0d7] font-bold text-sm md:text-base mb-2">💡 詳解說明：</p>
                            <p className="text-gray-200 text-sm md:text-base leading-relaxed whitespace-pre-wrap">{currentQuestionData.explanation}</p>
                          </div>
                        )}
                      </div>
                    )}

                    {isBingoStage ? (
                       <div className="space-y-2">
                         {myRank > 0 ? (
                           <p className="text-3xl text-green-500 font-bold">🎉 第 {myRank} 名 Bingo!</p>
                         ) : (
                           <p className="text-2xl text-gray-400 font-bold">👍 挑戰結束 (未進入排名)</p>
                         )}
                         <p className="text-4xl md:text-5xl mt-4 text-yellow-400 font-bold drop-shadow-[0_0_15px_rgba(250,204,21,0.8)] animate-bounce">
                           +{myAddedScore}
                         </p>
                       </div>
                    ) : (
                      amICorrect ? (
                        <div className="space-y-2 flex flex-col items-center">
                          <p className="text-3xl text-green-500 font-bold mb-3">✅ 答案正確！</p>
                          <div className="flex justify-center items-center gap-3 text-white text-lg bg-[#00FF41]/20 w-fit px-4 py-1 rounded-full border border-[#00FF41]/50">
                            ⏱️ 耗時: <span className="font-bold text-[#00FF41]">{myTimeTaken} 秒</span>
                          </div>
                          <p className="text-4xl md:text-5xl mt-4 text-yellow-400 font-bold drop-shadow-[0_0_15px_rgba(250,204,21,0.8)] animate-bounce">
                            +{myAddedScore}
                          </p>
                        </div>
                      ) : myLastAnswer === '未作答' ? (
                        <div className="space-y-2 flex flex-col items-center py-4">
                          <p className="text-3xl md:text-4xl text-gray-400 font-bold">⏳ 時間到 / 未作答</p>
                        </div>
                      ) : (
                        <div className="space-y-3 flex flex-col items-center py-4">
                          <p className="text-3xl md:text-4xl text-red-500 font-bold">❌ 答案錯誤</p>
                          <div className="flex justify-center items-center gap-2 text-white text-lg bg-red-500/20 w-fit px-4 py-2 rounded-full border border-red-500/50">
                            你的答案: <span className="font-bold text-red-400">{myLastAnswer || '(空白)'}</span>
                          </div>
                        </div>
                      )
                    )}

                    <div className="h-px w-full bg-[#00FF41]/20 my-4"></div>
                    <p className="text-lg md:text-xl text-white mb-2">🏆 你的總積分：<span className="text-3xl font-bold text-yellow-400">{myScore}</span></p>

                    <div className="mt-6 text-left">
                       <p className="text-[#00FF41]/80 text-sm mb-2 border-b border-[#00FF41]/30 pb-1">排行榜 Top 5</p>
                       <div className="space-y-2">
                         {leaderboardData.slice(0, 5).map((p, i) => (
                           <div key={i} className="flex justify-between items-center text-sm md:text-base bg-[#00FF41]/5 p-2 rounded border border-[#00FF41]/20">
                             <div className="flex gap-2 items-center">
                               <span className="text-gray-400 w-4 font-bold">{i + 1}.</span>
                               <span className="text-white truncate max-w-[100px] md:max-w-[200px]">{p.name}</span>
                             </div>
                             <span className="text-yellow-400 font-bold whitespace-nowrap">{p.score} 分</span>
                           </div>
                         ))}
                       </div>
                    </div>

                  </div>
                </div>
              )}

              {gameState === 'final_leaderboard' && (
                <div className="text-center w-full max-w-3xl mx-auto my-auto py-8 flex flex-col h-full max-h-[80vh]">
                  <h2 className="text-4xl md:text-6xl font-bold text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.8)] mb-6 animate-pulse">🏆 最終總排行 🏆</h2>

                  <div className="bg-black/60 p-6 md:p-8 rounded-2xl border-2 border-yellow-500/50 shadow-[0_0_30px_rgba(250,204,21,0.2)] flex-1 overflow-y-auto">
                    <div className="space-y-3">
                      {leaderboardData.map((p, i) => (
                        <div key={i} className={`flex justify-between items-center text-lg md:text-2xl p-4 rounded-xl border transition-all
                          ${i === 0 ? 'bg-yellow-500/20 border-yellow-400 text-yellow-400 font-bold scale-[1.02] md:scale-110 my-4 shadow-[0_0_15px_rgba(250,204,21,0.5)]' :
                            i === 1 ? 'bg-gray-300/10 border-gray-300 text-gray-200 font-bold' :
                            i === 2 ? 'bg-orange-400/10 border-orange-400 text-orange-300 font-bold' :
                            'bg-[#00FF41]/10 border-[#00FF41]/30 text-white'}`}>
                          <div className="flex gap-4 items-center">
                            <span className="w-10 md:w-16 text-center text-3xl md:text-5xl lg:text-6xl">
                              {i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : <span className="text-2xl md:text-4xl text-gray-500">{i + 1}.</span>}
                            </span>
                            <span className="truncate max-w-[200px] md:max-w-[400px]">{p.name}</span>
                          </div>
                          <span className="tracking-wider whitespace-nowrap">{p.score} 分</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
